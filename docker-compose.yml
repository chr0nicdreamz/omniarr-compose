services:
  omniarr:
    build: .
    container_name: omniarr
    restart: unless-stopped
    ports:
      - "8585:8585"
    environment:
      - OMNIARR_API_KEY=change_me_to_a_secure_key
      # Prowlarr
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_API_KEY=your_prowlarr_api_key
      # qBittorrent
      - QBIT_URL=http://qbittorrent:8080
      - QBIT_USER=admin
      - QBIT_PASS=adminadmin
      - QBIT_CATEGORY=omniarr
      # Plex
      - PLEX_URL=http://plex:32400
      - PLEX_TOKEN=your_plex_token
      # Library Paths (Inside Container)
      - DOWNLOAD_DIR=/data/torrents
      - MOVIES_DIR=/data/media/movies
      - TV_DIR=/data/media/tv
      - MUSIC_DIR=/data/media/music
    volumes:
      - ./config:/app/config
      - /path/to/your/data:/data
